<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#10162b"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>

    <radialGradient id="glowSpot" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

  </defs>

  <!-- background -->
  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- soft glow blobs -->
  <circle cx="180" cy="60" r="180" fill="url(#glowSpot)" filter="url(#softBlur)"/>
  <circle cx="1040" cy="300" r="200" fill="url(#glowSpot)" filter="url(#softBlur)"/>

  <!-- subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
  </g>

  <!-- thin frame -->
  <rect x="12" y="12" width="1176" height="336" rx="18" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- ===================== ICONS ROW ===================== -->
  <!-- HTML5 -->
  <g transform="translate(400,72)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 0,-8; 0,0" dur="2.8s" begin="0s" repeatCount="indefinite"/>
    <circle r="30" fill="#141a2e" stroke="#ff7a45" stroke-opacity="0.65" stroke-width="1.5"/>
    <circle r="25" fill="#ff5f2e" opacity="0.08">
      <animate attributeName="r" values="23;27;23" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.05;0.13;0.05" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M-12,-15 H12 L9,14 L0,18 L-9,14 Z" fill="#e44d26"/>
    <path d="M0,-12 H9 L7,12 L0,15 Z" fill="#f16529"/>
    <path d="M-6,-8 H7 L6,-3 H-1 L-1,1 H6 L5,9 L0,11 L-5,9 L-5,4 H-1 L-1,6 L0,7 L2,6 L2,4 H-6 Z" fill="#fff"/>
    <circle cx="18" cy="-18" r="3.5" fill="#ff7a45">
      <animate attributeName="opacity" values=".25;1;.25" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CSS3 -->
  <g transform="translate(500,72)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 0,-8; 0,0" dur="2.8s" begin="0.35s" repeatCount="indefinite"/>
    <circle r="30" fill="#141a2e" stroke="#4ea9ff" stroke-opacity="0.65" stroke-width="1.5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 0 0;3 0 0;-3 0 0" dur="3.4s" repeatCount="indefinite"/>
      <path d="M-12,-15 H12 L9,14 L0,18 L-9,14 Z" fill="#1572b6"/>
      <path d="M0,-12 H9 L7,12 L0,15 Z" fill="#33a9dc"/>
      <path d="M-7,-8 H7 L6,-3 H-2 L-2,1 H6 L5,9 L0,11 L-5,9 L-5,4 H-1 L-1,6 L0,7 L2,6 L2,4 H-6 Z" fill="#fff"/>
    </g>
    <path d="M-22,18 Q0,25 22,18" fill="none" stroke="#4ea9ff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values=".15;.6;.15" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- PYTHON -->
  <g transform="translate(600,72)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 0,-8; 0,0" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
    <circle r="30" fill="#141a2e" stroke="#7db7ff" stroke-opacity="0.65" stroke-width="1.5"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="2.6s" repeatCount="indefinite"/>
      <path d="M0,-17 C-11,-17 -12,-12 -12,-6 V-2 H1 V1 H-17 C-22,1 -24,5 -24,11 C-24,18 -20,22 -14,22 H-9 V15 C-9,10 -5,6 1,6 H11 C16,6 20,2 20,-3 V-10 C20,-15 16,-17 11,-17 Z" fill="#3776ab"/>
      <circle cx="8" cy="-11" r="2" fill="#fff"/>
      <path d="M0,17 C11,17 12,12 12,6 V2 H-1 V-1 H17 C22,-1 24,-5 24,-11 C24,-18 20,-22 14,-22 H9 V-15 C9,-10 5,-6 -1,-6 H-11 C-16,-6 -20,-2 -20,3 V10 C-20,15 -16,17 -11,17 Z" fill="#ffd343" transform="translate(0,3)"/>
      <circle cx="-8" cy="15" r="2" fill="#fff"/>
    </g>
  </g>

  <!-- EXCEL -->
  <g transform="translate(700,72)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 0,-8; 0,0" dur="2.8s" begin="1.05s" repeatCount="indefinite"/>
    <circle r="30" fill="#141a2e" stroke="#52d273" stroke-opacity="0.65" stroke-width="1.5"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;1.5,0;0,0" dur="2.5s" repeatCount="indefinite"/>
      <rect x="-13" y="-14" width="25" height="28" rx="3" fill="#107c41"/>
      <path d="M-8,-10 H7 M-8,-3 H7 M-8,4 H7" stroke="#35a96b" stroke-width="1.7" opacity=".8"/>
      <path d="M-2,-14 V14 M5,-14 V14" stroke="#35a96b" stroke-width="1.7" opacity=".8"/>
      <rect x="-18" y="-11" width="16" height="22" rx="2.5" fill="#185c37"/>
      <path d="M-14,-6 L-10,0 L-14,6 M-6,-6 L-10,0 L-6,6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <rect x="-20" y="18" width="40" height="2" rx="1" fill="#52d273" opacity=".25">
      <animate attributeName="width" values="10;40;10" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="-5;-20;-5" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- FIGMA -->
  <g transform="translate(800,72)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 0,-8; 0,0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    <circle r="30" fill="#141a2e" stroke="#d391f7" stroke-opacity="0.65" stroke-width="1.5"/>
    <g transform="translate(0,-1)">
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 0 0;4 0 0;0 0 0" dur="3s" repeatCount="indefinite"/>
      <rect x="-10" y="-17" width="10" height="10" rx="5" fill="#f24e1e"/>
      <rect x="0" y="-17" width="10" height="10" rx="5" fill="#ff7262"/>
      <rect x="-10" y="-7" width="10" height="10" rx="5" fill="#a259ff"/>
      <circle cx="5" cy="-2" r="5" fill="#1abcfe"/>
      <rect x="-10" y="3" width="10" height="10" rx="5" fill="#0acf83"/>
    </g>
    <circle cx="18" cy="16" r="2.5" fill="#d391f7">
      <animate attributeName="cy" values="16;11;16" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===================== NOME ===================== -->
  <text x="50%" y="54%" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="800" fill="url(#textGrad)" filter="url(#blurGlow)" opacity="0.55">
    YASSSS
  </text>
  <text x="50%" y="54%" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="800" fill="url(#textGrad)" letter-spacing="6">
    YASSSS
  </text>

  <!-- ===================== TEXTO ANIMADO (troca de palavras) ===================== -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" letter-spacing="6" text-anchor="middle">
    <text x="50%" y="86%" fill="#7dd3fc" opacity="0">
      PRECISÃO
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.08;0.28;0.34;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="50%" y="86%" fill="#a78bfa" opacity="0">
      LÓGICA
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.08;0.28;0.34;1" dur="6s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="50%" y="86%" fill="#f0abfc" opacity="0">
      DEV
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.08;0.28;0.34;1" dur="6s" begin="4s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
